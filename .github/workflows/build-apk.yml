name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter --version
          flutter create --platforms=android --org com.garagio --project-name garagio .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Unit tests (scan parser)
        run: flutter test
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "garagio-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: garagio-apk
          path: garagio-*.apk

      - name: Publish as "Latest test build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          files: garagio-*.apk
          body: |
            Android test build from commit ${{ github.sha }}.
            Download the .apk on your phone and open it to install (allow "Install unknown apps" when asked).
