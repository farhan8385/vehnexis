name: vehnexis
description: Vehnexis - keep every vehicle's papers, services, warranties and costs in one place.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_contacts: ^1.1.9
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
